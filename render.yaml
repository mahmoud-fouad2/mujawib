# ─────────────────────────────────────────────────────────────
# MUJAWIB — Render Blueprint
# Deploy: connect repo → Render auto-detects this file
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────

services:
  # Next.js web app (Operator Console + Client Portal + Marketing)
  - type: web
    name: mujawib-web
    runtime: node
    region: frankfurt # closest to GCC; change if needed
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mujawib-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false # set to https://your-app.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: REALTIME_SERVICE_URL
        fromService:
          type: web
          name: mujawib-realtime
          property: hostport

  # Sideband WebSocket service (OpenAI Realtime tool calls + live monitoring)
  # Sprint 1: SIP inbound + sideband controls
  - type: web
    name: mujawib-realtime
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd services/realtime && pnpm install --frozen-lockfile && pnpm build
    startCommand: cd services/realtime && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mujawib-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: '10000'

databases:
  # Neon is recommended for production; this Render Postgres is a fallback.
  # To use Neon: remove this block and set DATABASE_URL manually in dashboard.
  - name: mujawib-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: '16'
