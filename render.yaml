# ─────────────────────────────────────────────────────────────────────────────
# MUJAWIB — Render Blueprint
#
# Deploy: Render → New → Blueprint → point at this repo.
# The database is Neon (external), so no Render Postgres is provisioned here —
# set DATABASE_URL in the dashboard to the pooled Neon connection string.
#
# The Node web process also owns each accepted call's OpenAI sideband control
# socket. Audio remains on OpenAI SIP; no second media or demo runtime exists.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: mujawib-web
    runtime: node
    # Must match the Neon region. The database is in us-east-2, so running the
    # app in Frankfurt put the Atlantic between every query and the data —
    # which is what produced the ETIMEDOUT failures. Latency to Gulf users is
    # paid once per request; latency to the database is paid on every query in
    # the page, so co-locating with Neon wins by a wide margin.
    region: ohio
    plan: starter
    branch: main

    # `corepack enable` fails on Render: it tries to symlink into /usr/bin,
    # which is read-only. Render already exposes pnpm, and COREPACK_ENABLE_STRICT=0
    # stops it rejecting a version that differs from packageManager.
    # Migrations are tracked in Git and run before the new code goes live.
    buildCommand: pnpm install --frozen-lockfile && pnpm db:migrate && pnpm build
    startCommand: pnpm start

    # Liveness, not readiness.
    #
    # This used to point at /api/health, which returns 503 whenever a single
    # `select 1` fails. A transient Neon blip — which this app knows happens,
    # see isDatabaseUnavailable() in server/db/index.ts — was therefore read as
    # "this container is broken", and restarting the container is the one
    # response guaranteed to make it worse: it severs the control channel of
    # every call on the line. /api/health/live answers only "is this process
    # running code", and keeps answering 200 while draining, so a deploy is
    # never cut short. /api/health/ready still reports dependency state for
    # operators and uptime checks.
    healthCheckPath: /api/health/live
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Stops corepack blocking on a prompt, and from rejecting a pnpm version
      # that does not exactly match package.json#packageManager.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      - key: COREPACK_ENABLE_STRICT
        value: '0'

      # Next binds to this; Render injects the real port at runtime.
      - key: PORT
        value: '10000'

      # ─── call-path runtime ──────────────────────────────────────────────
      # Hands SIGTERM/SIGINT to server/runtime/lifecycle.ts instead of Next's
      # own handler, which exits as soon as the HTTP server closes. Without
      # this the drain below cannot run at all: the process is already gone.
      # Next documents this variable for exactly this purpose.
      - key: NEXT_MANUAL_SIG_HANDLE
        value: '1'

      # How long shutdown waits for calls to end before handing them over to
      # the replacement process. Must stay under Render's own kill grace
      # period, or the handover is cut off half-finished.
      - key: SHUTDOWN_DRAIN_TIMEOUT_MS
        value: '25000'

      # Concurrent calls this process will carry before refusing new ones with
      # SIP 486. Per-client limits (workspace.concurrentCallLimit) are a
      # contract, not a protection: twenty clients at ten each is two hundred
      # permitted calls on one instance. Raise only with load-test evidence.
      - key: ACTIVE_REALTIME_CALL_LIMIT
        value: '25'

      # Connections reserved for the voice runtime, separate from the pool the
      # console and portal use. Small on purpose — isolation, not headroom.
      - key: DATABASE_REALTIME_POOL_MAX
        value: '4'

      # This plan's memory ceiling. Node cannot discover it: V8 sizes its heap
      # from the *host's* memory, not the container's, so it has to be told.
      #
      # An instance was OOM-killed on 2026-09-01 ("Ran out of memory (used over
      # 512MB) while running your code"). The cause was arithmetic:
      # package.json#start passed --max-old-space-size=384, and V8 reports a
      # total heap limit of that plus ~192MB of other spaces — a 576MB ceiling
      # inside a 512MB box. V8 had no reason to collect before the platform
      # killed the process, and committed heap (heapTotal) grew toward a limit
      # the container could not honour. The flag is now 192, giving a 384MB
      # ceiling and roughly 90MB of headroom against measured non-heap RSS.
      #
      # This value is what the pressure signal and call admission measure
      # against. If the instance plan changes, change both together.
      - key: MEMORY_LIMIT_MB
        value: '512'

      # ─── set these in the Render dashboard ───────────────────────────────
      # Neon pooled connection string (must include ?sslmode=require)
      - key: DATABASE_URL
        sync: false

      # openssl rand -base64 32
      #
      # Set by hand, NOT generateValue. This key seals every stored two-factor
      # secret and backup code, so a regenerated value does not merely log
      # everyone out — it permanently bricks every enrolled authenticator, with
      # no route back through the browser (`pnpm 2fa:reset` becomes the only
      # way in). generateValue mints a fresh one whenever the service is
      # recreated from this blueprint, which is a foot-gun pointed at the
      # owner's own account. Keep the existing value when moving the service.
      - key: BETTER_AUTH_SECRET
        sync: false

      # Both must equal the final public URL of this service.
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Optional — Google sign-in only appears when both are present.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Optional — required for password recovery emails.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Required in production for caller numbers, SIP metadata, transcripts,
      # and tool payloads. Accepts a generated passphrase or a raw 32-byte key.
      # Generate with: openssl rand -base64 32
      - key: DATA_ENCRYPTION_KEY
        sync: false

      # Voice runtime. Both are required before the health check reports ready.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      # Pinned separately from the live voice model so summary behavior can be
      # upgraded and rolled back without touching active calls.
      - key: OPENAI_POST_CALL_MODEL
        value: gpt-5.4-mini-2026-03-17

      # Private call recordings. Leave disabled until the complete S3/R2
      # credential set below is configured and `pnpm recordings:verify-storage`
      # succeeds. The bucket itself must stay private.
      - key: RECORDING_STORAGE_ENABLED
        sync: false
      - key: RECORDING_STORAGE_ENDPOINT
        sync: false
      - key: RECORDING_STORAGE_REGION
        value: auto
      - key: RECORDING_STORAGE_BUCKET
        sync: false
      - key: RECORDING_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: RECORDING_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: RECORDING_MAX_SECONDS
        value: '3600'

      # Optional — error tracking. Unset means no Sentry activity at all;
      # server and client point at the same project, same DSN.
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

      # Optional — Twilio self-serve number search/purchase. Purchasing a
      # number still requires operator approval in-app; these credentials
      # alone do not let a client spend money unattended.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
