packages:
  - "."

overrides:
  esbuild@<=0.24.2: 0.25.12
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.3

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.10'
  - '@biomejs/cli-darwin-arm64@2.5.10'
  - '@biomejs/cli-darwin-x64@2.5.10'
  - '@biomejs/cli-linux-arm64-musl@2.5.10'
  - '@biomejs/cli-linux-arm64@2.5.10'
  - '@biomejs/cli-linux-x64-musl@2.5.10'
  - '@biomejs/cli-linux-x64@2.5.10'
  - '@biomejs/cli-win32-arm64@2.5.10'
  - '@biomejs/cli-win32-x64@2.5.10'

# Native post-install scripts pnpm is allowed to run.
#   esbuild    — backs tsx, used by `pnpm db:seed`
#   sharp      — Next's image optimiser
#   @sentry/cli — only downloads a binary for source-map upload, which needs a
#     SENTRY_AUTH_TOKEN/org/project this deployment does not have configured.
#     The SDK itself (Sentry.init/captureException/captureMessage) does not
#     need this binary at all, so it stays false until that upload step is
#     deliberately set up — never flip this without also wiring the token.
allowBuilds:
  '@sentry/cli': false
  esbuild: true
  sharp: true

# Refuse an install when an unreviewed dependency asks to run a build script.
strictDepBuilds: true
